<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Manager Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6fa;
}

header {
    background: #2196d3;
    color: white;
    padding: 20px;
}

.header-content {
    width: 92%;
    max-width: 1100px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-content h1 {
    margin: 0;
}

.logout-btn {
    background: white;
    color: #2196d3;
    border: none;
    padding: 11px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: 30px auto;
}

.welcome-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.welcome-box h2 {
    color: #2196d3;
    margin-top: 0;
}

.refresh-btn {
    background: #2196d3;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 20px;
}

.report-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.12);
}

.report-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid #ddd;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.report-title h2 {
    margin: 0;
    color: #333;
}

.status {
    padding: 8px 15px;
    border-radius: 20px;
    font-weight: bold;
}

.pending {
    background: #fff3cd;
    color: #856404;
}

.in-progress {
    background: #cfe2ff;
    color: #084298;
}

.resolved {
    background: #d1e7dd;
    color: #0f5132;
}

.rejected {
    background: #f8d7da;
    color: #842029;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.detail-box {
    background: #f8f9fa;
    padding: 13px;
    border-radius: 8px;
}

.description-box {
    margin-top: 15px;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 8px;
}

.description-text {
    margin-top: 8px;
    line-height: 1.6;
}

.gps-box {
    margin-top: 15px;
    background: #eef8ff;
    border: 1px solid #2196d3;
    padding: 15px;
    border-radius: 8px;
}

.map-btn {
    display: inline-block;
    margin-top: 10px;
    background: #2196d3;
    color: white;
    padding: 9px 15px;
    border-radius: 6px;
    text-decoration: none;
}

.photo-box {
    margin-top: 20px;
}

.report-photo {
    width: 100%;
    max-width: 450px;
    max-height: 350px;
    object-fit: contain;
    border-radius: 10px;
    border: 2px solid #ddd;
}

/* ASSIGN STAFF */

.assign-box {
    margin-top: 20px;
    padding: 20px;

    background: #f0f8ff;

    border: 1px solid #2196d3;

    border-radius: 8px;
}

.assign-box h3 {
    margin-top: 0;
    color: #2196d3;
}

.staff-select {
    width: 100%;
    max-width: 350px;

    padding: 12px;

    border: 2px solid #ccc;

    border-radius: 7px;

    font-size: 16px;
}

.assign-btn {
    display: block;

    margin-top: 12px;

    padding: 11px 20px;

    background: #673ab7;

    color: white;

    border: none;

    border-radius: 7px;

    cursor: pointer;

    font-size: 15px;
}

.assign-btn:hover {
    background: #512da8;
}

/* UPDATE */

.update-box {
    border-top: 1px solid #ddd;

    margin-top: 20px;

    padding-top: 20px;
}

.status-select {
    width: 100%;
    max-width: 300px;

    padding: 11px;

    border: 2px solid #ccc;

    border-radius: 7px;

    font-size: 16px;
}

.update-btn {
    display: block;

    margin-top: 10px;

    padding: 11px 20px;

    background: #28a745;

    color: white;

    border: none;

    border-radius: 7px;

    cursor: pointer;
}

.no-reports {
    background: white;

    padding: 40px;

    text-align: center;

    border-radius: 12px;
}

@media (max-width: 700px) {

    .header-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .report-title {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-content">

<div>

<h1>
Manager Dashboard
</h1>

<p>
Manage Infrastructure Complaints
</p>

</div>

<button
class="logout-btn"
id="logoutBtn">

Logout

</button>

</div>

</header>



<div class="container">


<div class="welcome-box">

<h2>
Welcome, Manager
</h2>

<p>
Review complaints, assign them to staff members,
and monitor their progress.
</p>

</div>


<button
class="refresh-btn"
id="refreshBtn">

🔄 Refresh Reports

</button>


<div id="reportList"></div>


</div>



<script>


/* ==========================================
   STAFF LIST
========================================== */

const staffMembers = [

    {
        id: "STAFF001",
        name: "Arun"
    },

    {
        id: "STAFF002",
        name: "Priya"
    },

    {
        id: "STAFF003",
        name: "Karthik"
    },

    {
        id: "STAFF004",
        name: "Divya"
    }

];



/* ==========================================
   GET REPORTS
========================================== */

function getReports() {

    const data =
        localStorage.getItem("reports");

    if (!data) {

        return [];

    }

    try {

        const reports =
            JSON.parse(data);

        return Array.isArray(reports)
            ? reports
            : [];

    }

    catch (error) {

        console.error(error);

        return [];

    }

}



/* ==========================================
   SAVE REPORTS
========================================== */

function saveReports(reports) {

    localStorage.setItem(
        "reports",
        JSON.stringify(reports)
    );

}



/* ==========================================
   STATUS CLASS
========================================== */

function getStatusClass(status) {

    if (status === "In Progress") {

        return "in-progress";

    }

    if (status === "Resolved") {

        return "resolved";

    }

    if (status === "Rejected") {

        return "rejected";

    }

    return "pending";

}



/* ==========================================
   LOAD REPORTS
========================================== */

function loadReports() {

    const reportList =
        document.getElementById("reportList");

    const reports =
        getReports();

    reportList.innerHTML = "";


    if (reports.length === 0) {

        reportList.innerHTML = `

        <div class="no-reports">

            <h2>
                No Reports Available
            </h2>

            <p>
                No infrastructure complaints
                have been submitted yet.
            </p>

        </div>

        `;

        return;

    }


    const displayReports =
        [...reports].reverse();


    displayReports.forEach(function(report) {


        const originalIndex =
            reports.findIndex(function(item) {

                return String(item.id) ===
                       String(report.id);

            });


        const status =
            report.status || "Pending";


        const statusClass =
            getStatusClass(status);


        /* ======================================
           PHOTO
        ====================================== */

        let photoHTML = "";


        if (report.photo) {

            photoHTML = `

            <div class="photo-box">

                <h3>
                    📷 Problem Photo
                </h3>

                <img
                    src="${report.photo}"
                    class="report-photo"
                    alt="Problem Photo">

            </div>

            `;

        }


        /* ======================================
           GPS
        ====================================== */

        let gpsHTML = "";


        if (
            report.latitude !== undefined &&
            report.longitude !== undefined
        ) {

            const mapURL =
                "https://www.google.com/maps?q=" +
                encodeURIComponent(
                    report.latitude +
                    "," +
                    report.longitude
                );


            gpsHTML = `

            <div class="gps-box">

                <strong>
                    📍 GPS Location
                </strong>

                <p>
                    Latitude:
                    ${report.latitude}
                </p>

                <p>
                    Longitude:
                    ${report.longitude}
                </p>

                <a
                    href="${mapURL}"
                    target="_blank"
                    class="map-btn">

                    🗺️ View Location

                </a>

            </div>

            `;

        }


        /* ======================================
           CURRENT STAFF
        ====================================== */

        let assignedStaff =
            report.assignedStaff || "Not Assigned";


        /* ======================================
           STAFF OPTIONS
        ====================================== */

        let staffOptions = `

            <option value="">
                Select Staff Member
            </option>

        `;


        staffMembers.forEach(function(staff) {

            staffOptions += `

                <option
                    value="${staff.id}"
                    ${report.assignedStaffId === staff.id
                    ? "selected"
                    : ""}>

                    ${staff.name}

                </option>

            `;

        });


        /* ======================================
           REPORT CARD
        ====================================== */

        const card =
            document.createElement("div");


        card.className =
            "report-card";


        card.innerHTML = `

        <div class="report-title">

            <h2>
                ${report.category || "Issue Report"}
            </h2>

            <span
                class="status ${statusClass}">

                ${status}

            </span>

        </div>


        <div class="details">


            <div class="detail-box">

                <strong>
                    Report ID
                </strong>

                <br>

                ${report.id || "N/A"}

            </div>


            <div class="detail-box">

                <strong>
                    Date
                </strong>

                <br>

                ${report.date || "N/A"}

            </div>


            <div class="detail-box">

                <strong>
                    Category
                </strong>

                <br>

                ${report.category || "N/A"}

            </div>


            <div class="detail-box">

                <strong>
                    Address
                </strong>

                <br>

                ${report.address || "N/A"}

            </div>


            <div class="detail-box">

                <strong>
                    Assigned Staff
                </strong>

                <br>

                ${assignedStaff}

            </div>


        </div>


        <!-- DESCRIPTION -->

        <div class="description-box">

            <strong>
                Problem Description
            </strong>

            <div class="description-text">

                ${report.description || "No description provided."}

            </div>

        </div>


        <!-- GPS -->

        ${gpsHTML}


        <!-- PHOTO -->

        ${photoHTML}


        <!-- ASSIGN STAFF -->

        <div class="assign-box">

            <h3>
                👷 Assign Staff
            </h3>

            <p>
                Select the staff member responsible
                for handling this complaint.
            </p>


            <select
                class="staff-select"
                data-index="${originalIndex}">

                ${staffOptions}

            </select>


            <button
                class="assign-btn"
                data-index="${originalIndex}">

                Assign Staff

            </button>

        </div>


        <!-- STATUS -->

        <div class="update-box">

            <strong>
                Update Complaint Status
            </strong>

            <br><br>


            <select
                class="status-select"
                data-index="${originalIndex}">

                <option
                    value="Pending"
                    ${status === "Pending"
                    ? "selected"
                    : ""}>

                    Pending

                </option>


                <option
                    value="In Progress"
                    ${status === "In Progress"
                    ? "selected"
                    : ""}>

                    In Progress

                </option>


                <option
                    value="Resolved"
                    ${status === "Resolved"
                    ? "selected"
                    : ""}>

                    Resolved

                </option>


                <option
                    value="Rejected"
                    ${status === "Rejected"
                    ? "selected"
                    : ""}>

                    Rejected

                </option>

            </select>


            <button
                class="update-btn"
                data-index="${originalIndex}">

                Update Status

            </button>

        </div>


        `;


        reportList.appendChild(card);

    });


    /* ======================================
       ASSIGN BUTTON EVENTS
    ====================================== */

    document
        .querySelectorAll(".assign-btn")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const index =
                        Number(
                            this.dataset.index
                        );

                    assignStaff(index);

                }
            );

        });


    /* ======================================
       STATUS BUTTON EVENTS
    ====================================== */

    document
        .querySelectorAll(".update-btn")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const index =
                        Number(
                            this.dataset.index
                        );

                    updateStatus(index);

                }
            );

        });

}



/* ==========================================
   ASSIGN STAFF
========================================== */

function assignStaff(index) {

    const reports =
        getReports();


    if (
        index < 0 ||
        index >= reports.length
    ) {

        alert(
            "Report not found."
        );

        return;

    }


    const select =
        document.querySelector(
            '.staff-select[data-index="' +
            index +
            '"]'
        );


    if (!select) {

        alert(
            "Staff selection not found."
        );

        return;

    }


    const staffId =
        select.value;


    if (!staffId) {

        alert(
            "Please select a staff member."
        );

        return;

    }


    const staff =
        staffMembers.find(function(item) {

            return item.id === staffId;

        });


    if (!staff) {

        alert(
            "Staff member not found."
        );

        return;

    }


    /* SAVE STAFF */

    reports[index].assignedStaffId =
        staff.id;


    reports[index].assignedStaff =
        staff.name;
        
    reports[index].assignmentSeen = false;


    /* CHANGE STATUS */

    if (
        !reports[index].status ||
        reports[index].status === "Pending"
    ) {

        reports[index].status =
            "In Progress";

    }


    /* SAVE */

    saveReports(reports);


    alert(
        "Complaint assigned to " +
        staff.name +
        " successfully!"
    );


    loadReports();

}



/* ==========================================
   UPDATE STATUS
========================================== */

function updateStatus(index) {

    const reports =
        getReports();


    if (
        index < 0 ||
        index >= reports.length
    ) {

        alert(
            "Report not found."
        );

        return;

    }


    const select =
        document.querySelector(
            '.status-select[data-index="' +
            index +
            '"]'
        );


    if (!select) {

        alert(
            "Status selection not found."
        );

        return;

    }


    reports[index].status =
        select.value;


    saveReports(reports);


    alert(
        "Status updated successfully!"
    );


    loadReports();

}



/* ==========================================
   REFRESH
========================================== */

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        function() {

            loadReports();

            alert(
                "Reports refreshed!"
            );

        }
    );



/* ==========================================
   LOGOUT
========================================== */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "loggedInUser"
            );

            window.location.href =
                "index.html";

        }
    );



/* ==========================================
   INITIAL LOAD
========================================== */

loadReports();

</script>

</body>

</html>
