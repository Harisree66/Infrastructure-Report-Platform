<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Apartment Infrastructure Report System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2196d3;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2196d3;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .eye {
            position: absolute;
            right: 15px;
            top: 13px;
            cursor: pointer;
            font-size: 20px;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 6px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #2196d3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1976b5;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a {
            color: #2196d3;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>


<body>

<div class="container">

    <h1>Apartment Infrastructure Report System</h1>

    <p class="subtitle">
        Create your account
    </p>


    <form id="registerForm">

        <!-- NAME -->

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <div id="nameError" class="error"></div>


        <!-- EMAIL -->

        <label for="email">
            Gmail
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your Gmail"
            required
        >

        <div id="emailError" class="error"></div>


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <span
                class="eye"
                id="eye"
                onclick="togglePassword('password','eye')"
            >
                👁️
            </span>

        </div>

        <div id="passwordError" class="error"></div>


        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">
            Confirm Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                required
            >

            <span
                class="eye"
                id="confirmEye"
                onclick="togglePassword('confirmPassword','confirmEye')"
            >
                👁️
            </span>

        </div>

        <div id="confirmError" class="error"></div>


        <!-- ROLE -->

        <label for="role">
            Register As
        </label>

        <select id="role" required>

            <option value="">
                Select Role
            </option>

            <option value="Resident">
                Resident
            </option>

            <option value="Manager">
                Manager
            </option>

            <option value="Staff">
                Staff
            </option>

        </select>

        <div id="roleError" class="error"></div>


        <!-- REGISTER BUTTON -->

        <button type="submit">
            Register
        </button>


        <div id="successMessage" class="success"></div>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="index.html">
            Login here
        </a>

    </div>

</div>


<script>

    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    function togglePassword(inputId, eyeId) {

        const password =
            document.getElementById(inputId);

        const eye =
            document.getElementById(eyeId);


        if (password.type === "password") {

            password.type = "text";

            eye.textContent = "🙈";

        } else {

            password.type = "password";

            eye.textContent = "👁️";

        }

    }


    // ==========================================
    // REGISTRATION
    // ==========================================

    document
        .getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            // Get values

            const name =
                document.getElementById("name")
                .value
                .trim();

            const email =
                document.getElementById("email")
                .value
                .trim();

            const password =
                document.getElementById("password")
                .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                .value;

            const role =
                document.getElementById("role")
                .value;


            // Error elements

            const nameError =
                document.getElementById("nameError");

            const emailError =
                document.getElementById("emailError");

            const passwordError =
                document.getElementById("passwordError");

            const confirmError =
                document.getElementById("confirmError");

            const roleError =
                document.getElementById("roleError");

            const successMessage =
                document.getElementById("successMessage");


            // Clear old messages

            nameError.textContent = "";
            emailError.textContent = "";
            passwordError.textContent = "";
            confirmError.textContent = "";
            roleError.textContent = "";
            successMessage.textContent = "";


            // ==========================================
            // NAME VALIDATION
            // ==========================================

            if (name.length < 3) {

                nameError.textContent =
                    "✕ Please enter your full name";

                return;

            }


            // ==========================================
            // GMAIL VALIDATION
            // ==========================================

            if (!email.endsWith("@gmail.com")) {

                emailError.textContent =
                    "✕ Please enter a valid Gmail address";

                return;

            }


            // ==========================================
            // PASSWORD VALIDATION
            // ==========================================

            if (password.length < 6) {

                passwordError.textContent =
                    "✕ Password must contain at least 6 characters";

                return;

            }


            // ==========================================
            // CONFIRM PASSWORD
            // ==========================================

            if (password !== confirmPassword) {

                confirmError.textContent =
                    "✕ Passwords do not match";

                return;

            }


            // ==========================================
            // ROLE VALIDATION
            // ==========================================

            if (role === "") {

                roleError.textContent =
                    "✕ Please select a role";

                return;

            }


            // ==========================================
            // GET EXISTING USERS
            // ==========================================

            let users =
                JSON.parse(
                    localStorage.getItem("users")
                ) || [];


            // ==========================================
            // CHECK WHETHER ACCOUNT ALREADY EXISTS
            // ==========================================

            const existingUser =
                users.find(function(user) {

                    return user.email === email;

                });


            if (existingUser) {

                emailError.textContent =
                    "✕ This account already exists";

                return;

            }


            // ==========================================
            // CREATE NEW USER
            // ==========================================

            const newUser = {

                name: name,

                email: email,

                password: password,

                role: role

            };


            // Add user

            users.push(newUser);


            // ==========================================
            // SAVE USER
            // ==========================================

            localStorage.setItem(
                "users",
                JSON.stringify(users)
            );


            // ==========================================
            // SUCCESS MESSAGE
            // ==========================================

            successMessage.textContent =
                "✓ Registered successfully!";


            // Clear form

            document
                .getElementById("registerForm")
                .reset();


            // ==========================================
            // GO TO LOGIN PAGE
            // ==========================================

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1500);

        });

</script>

</body>

</html>
