<!DOCTYPE html>
<html lang="en">

<head>
   

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resident Dashboard</title>
    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7fb;
        }

        header {
            background: #3498db;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout {
            width: auto;
            background: #e74c3c;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .report-button {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 25px;
        }

        .reports {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .report-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: orange;
        }

        .progress {
            color: #3498db;
        }

        .completed {
            color: green;
        }

        .no-reports {
            color: #777;
        }

    </style>

</head>

<body>

<header>

    <div class="top">

        <h1>Resident Dashboard</h1>

        <button class="logout"
                onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">


    <div class="welcome">

        <h2>Welcome Resident</h2>

        <p>
            Logged in as:
            <strong id="userEmail"></strong>
        </p>

    </div>


    <a href="report.html"
       class="report-button">

        + Report an Issue

    </a>


    <div class="reports">

        <h2>My Reports</h2>

        <div id="reportList"></div>

    </div>

</div>

<script src="js/resident.js"></script>

</body>
</html>
