<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Issue</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fa;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2196d3;
        }

        h2 {
            color: #333;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2196d3;
            outline: none;
        }

        .gps-box {
            background: #eef8ff;
            border: 1px solid #2196d3;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .gps-button {
            background: #2196d3;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }

        .gps-button:hover {
            background: #1976b5;
        }

        #locationStatus {
            margin-top: 10px;
            font-weight: bold;
        }

        #photoPreview {
            display: none;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .submit-button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #218838;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #2196d3;
            font-weight: bold;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .error {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .coordinates {
            margin-top: 10px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Report an Issue</h1>

        <form id="reportForm">

            <!-- PROBLEM CATEGORY -->

            <label for="category">
                Problem Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Problem
                </option>

                <option value="Water Leakage">
                    Water Leakage
                </option>

                <option value="Electrical Problem">
                    Electrical Problem
                </option>

                <option value="Lift Problem">
                    Lift Problem
                </option>

                <option value="Road Damage">
                    Road Damage
                </option>

                <option value="Garbage">
                    Garbage
                </option>

                <option value="Plumbing">
                    Plumbing
                </option>

                <option value="Security">
                    Security
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- PROBLEM DESCRIPTION -->

            <label for="description">
                Problem Description
            </label>

            <textarea
                id="description"
                placeholder="Describe the problem clearly..."
                required>
            </textarea>


            <!-- ADDRESS -->

            <label for="address">
                Location / Address
            </label>

            <input
                type="text"
                id="address"
                placeholder="Enter apartment/block/location"
                required>


            <!-- GPS LOCATION -->

            <label>
                GPS Location
            </label>

            <div class="gps-box">

                <button
                    type="button"
                    class="gps-button"
                    onclick="getGPSLocation()">

                    📍 Get Current GPS Location

                </button>

                <div id="locationStatus">
                    GPS location not captured.
                </div>

                <div class="coordinates">

                    <strong>Latitude:</strong>
                    <span id="latitude">Not available</span>

                    <br>

                    <strong>Longitude:</strong>
                    <span id="longitude">Not available</span>

                </div>

            </div>


            <!-- PHOTO -->

            <label for="photo">
                Upload / Take Photo
            </label>

            <input
                type="file"
                id="photo"
                accept="image/*"
                capture="environment"
                required>

            <img
                id="photoPreview"
                alt="Selected Photo">


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-button">

                Submit Report

            </button>

            <div id="message"></div>

        </form>


        <a
            href="resident.html"
            class="back-button">

            ← Back to Resident Dashboard

        </a>

    </div>

</div>


<script>

    /* =========================================
       GPS VARIABLES
    ========================================= */

    let latitude = null;
    let longitude = null;


    /* =========================================
       GET GPS LOCATION
    ========================================= */

    function getGPSLocation() {

        const status =
            document.getElementById("locationStatus");

        if (!navigator.geolocation) {

            status.innerHTML =
                "❌ GPS is not supported by this browser.";

            status.style.color = "red";

            return;
        }


        status.innerHTML =
            "📍 Getting your GPS location...";

        status.style.color = "#2196d3";


        navigator.geolocation.getCurrentPosition(

            function(position) {

                latitude =
                    position.coords.latitude;

                longitude =
                    position.coords.longitude;


                document.getElementById("latitude")
                    .textContent =
                    latitude.toFixed(6);


                document.getElementById("longitude")
                    .textContent =
                    longitude.toFixed(6);


                status.innerHTML =
                    "✅ GPS location captured successfully.";

                status.style.color = "green";

            },

            function(error) {

                status.style.color = "red";

                if (error.code === 1) {

                    status.innerHTML =
                        "❌ Location permission denied.";

                }
                else if (error.code === 2) {

                    status.innerHTML =
                        "❌ Location unavailable.";

                }
                else if (error.code === 3) {

                    status.innerHTML =
                        "❌ GPS request timed out.";

                }
                else {

                    status.innerHTML =
                        "❌ Unable to get GPS location.";

                }

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }

        );

    }


    /* =========================================
       PHOTO PREVIEW
    ========================================= */

    document
        .getElementById("photo")
        .addEventListener("change", function(event) {

            const file = event.target.files[0];

            const preview =
                document.getElementById("photoPreview");


            if (file) {

                const reader =
                    new FileReader();


                reader.onload = function(e) {

                    preview.src =
                        e.target.result;

                    preview.style.display =
                        "block";

                };


                reader.readAsDataURL(file);

            }
            else {

                preview.style.display =
                    "none";

            }

        });


    /* =========================================
       SUBMIT REPORT
    ========================================= */

    document
        .getElementById("reportForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const category =
                document.getElementById("category").value;

            const description =
                document.getElementById("description").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const photoInput =
                document.getElementById("photo");


            const message =
                document.getElementById("message");


            /* CHECK GPS */

            if (latitude === null ||
                longitude === null) {

                message.innerHTML =
                    "❌ Please capture your GPS location before submitting.";

                message.className =
                    "error";

                return;
            }


            /* CHECK PHOTO */

            if (photoInput.files.length === 0) {

                message.innerHTML =
                    "❌ Please upload a photo of the problem.";

                message.className =
                    "error";

                return;
            }


            const photo =
                photoInput.files[0];


            /* CONVERT PHOTO TO BASE64 */

            const reader =
                new FileReader();


            reader.onload = function() {

                const photoData =
                    reader.result;


                /* CREATE REPORT */

                const report = {

                    id:
                        "REP" +
                        Date.now(),

                    category:
                        category,

                    description:
                        description,

                    address:
                        address,

                    latitude:
                        latitude,

                    longitude:
                        longitude,

                    photo:
                        photoData,

                    photoName:
                        photo.name,

                    status:
                        "Pending",

                    date:
                        new Date().toLocaleString()

                };


                /* GET EXISTING REPORTS */

                let reports =
                    JSON.parse(
                        localStorage.getItem("reports")
                    ) || [];


                /* ADD NEW REPORT */

                reports.push(report);


                /* SAVE REPORTS */

                localStorage.setItem(
                    "reports",
                    JSON.stringify(reports)
                );


                /* SUCCESS MESSAGE */

                message.innerHTML =
                    "✅ Report submitted successfully!";

                message.className =
                    "success";


                /* CLEAR FORM */

                document
                    .getElementById("reportForm")
                    .reset();


                document
                    .getElementById("photoPreview")
                    .style.display = "none";


                document
                    .getElementById("latitude")
                    .textContent =
                    "Not available";


                document
                    .getElementById("longitude")
                    .textContent =
                    "Not available";


                document
                    .getElementById("locationStatus")
                    .textContent =
                    "GPS location not captured.";


                latitude = null;
                longitude = null;


                /* GO TO RESIDENT DASHBOARD */

                setTimeout(function() {

                    window.location.href =
                        "resident.html";

                }, 1500);

            };


            reader.readAsDataURL(photo);

        });

</script>

</body>
</html>
